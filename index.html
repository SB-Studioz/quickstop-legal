<head>
<meta charset="utf-8">

<title>QuickStop — Legal</title>
<style>
  :root { color-scheme: light dark; --ink:#14141f; --muted:#5b5b70; --bg:#fff; --rule:#e6e6ef; --accent:#5b3be8; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f5f5fa; --muted:#a0a0b8; --bg:#0b0b12; --rule:#26263a; --accent:#9d7bff; }
  }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:34rem; margin:0 auto; padding:4rem 1.25rem; }
  h1 { font-size:1.8rem; letter-spacing:-.02em; margin:0 0 .25rem; }
  p.sub { color:var(--muted); margin:0 0 2.5rem; }
  a.card { display:block; padding:1.1rem 1.25rem; margin-bottom:.75rem;
           border:1px solid var(--rule); border-radius:12px;
           text-decoration:none; color:inherit; }
  a.card:hover { border-color:var(--accent); }
  a.card strong { display:block; color:var(--accent); }
  a.card span { color:var(--muted); font-size:.92rem; }
  footer { margin-top:3rem; color:var(--muted); font-size:.9rem; }
</style>
</head>

<main>
